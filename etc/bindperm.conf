# /etc/bindperm.conf
#
# ports[/proto]:subject[:r]
#   ports   N, A-B, or 0 (any port)
#   proto   tcp (default), udp, tcp+udp
#   subject user name, uid, @group or @gid
#   r       also apply to descendant processes and the user's cgroup
#
# Examples (uncomment and adapt):
#80:www
#53/udp:dns:r
#443/tcp+udp:www:r
#0:@webadmins

include /etc/bindperm.d/*.conf