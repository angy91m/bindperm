name: Build and Release Debian Package

on:
  push:
    branches:
    - test
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag della release (es. 1.0.0)'
        required: true
        type: string
        default: 0.1.0
permissions:
  contents: write
jobs:
  build:
    name: Build per ${{ matrix.arch }}
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version || '0.1.0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          nobtf: ''
          artifact_name: bindperm-linux-x64.deb
        # - arch: arm64
        #   nobtf: ''
        #   artifact_name: bindperm-linux-arm64.deb
        # - arch: arm64
        #   nobtf: '1'
        #   artifact_name: bindperm-nobtf-linux-arm64.deb
    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Build dell'immagine Docker
      run: docker build --platform linux/${{ matrix.arch }} -t debian-builder-${{ matrix.arch }} .
    - name: Build del codice
      run: |
        docker run --privileged --rm \
        -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
        -v /sys/fs/bpf:/sys/fs/bpf \
        -v /boot:/boot:ro \
        -v ${{ github.workspace }}:/work \
        debian-builder-${{ matrix.arch }} bash -c "
          export LIBBPF_PREFIX=/opt/libbpf
          export CLANG=clang-16
          export BPFTOOL=/usr/local/sbin/bpftool
          export NOBTF='${{ matrix.nobtf }}'
          make check-requirements && make
          chown -R $(id -u):$(id -g) /work
        "
    - name: Build deb
      run: |
        mkdir -p dist
        .github/workflows/scripts/build-deb.sh "$APP_VERSION" "${{ matrix.arch }}" \
          "$(pwd)/build/bindperm" "${{ matrix.artifact_name }}"
    - name: Carica artefatto temporaneo
      uses: actions/upload-artifact@v4
      with:
        name: build-$APP_VERSION-${{ matrix.arch }}
        path: dist/${{ matrix.artifact_name }}
        if-no-files-found: error
  prerelease:
    name: Publish Pre-Release
    needs: build
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.version || '0.1.0' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Scarica tutti gli artefatti
      uses: actions/download-artifact@v4
      with:
        path: all-artifacts
        pattern: build-*
        merge-multiple: true
    - name: Costruisci note con link dinamici e pubblica
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        # 1. Genera il tag univoco
        TAG_NAME="v-test-$(date +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}"
        # BASE_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}"

        # 2. Crea la release allegando tutti i file presenti in all-artifacts/
        gh release create "$TAG_NAME" all-artifacts/* \
          --target test \
          --prerelease \
          --title "Test Build: $TAG_NAME" \
          --generate-notes
    # - name: Crea la GitHub Release
    #   uses: softprops/action-gh-release@v2
    #   with:
    #     tag_name: ${{ github.event.inputs.tag_name }}
    #     files: ${{ env.deb_path }}
    #     generate_release_notes: true